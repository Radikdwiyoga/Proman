name: Daily Recap to Telegram

# Mengirim rekap harian pekerjaan ke grup Telegram.
#
# Dipicu manual dengan `gh workflow run daily-recap.yml`, dan otomatis lewat
# beberapa slot jadwal setiap hari.
#
# Kenapa banyak slot, bukan satu?
# Cron GitHub Actions tidak menjamin eksekusi tepat pada menitnya. Jadwal
# '0 1 * * 1-5' (01:00 UTC = 08:00 WIB) pernah nyata telat 6 jam — baru
# berjalan pukul 14:03 WIB. Men-shift satu jadwal hanya memindahkan jendela
# kacau, tidak hilang.
#
# Jadi jadwalnya dipecah jadi beberapa slot yang tersebar, lalu script
# memutuskan sendiri: kirim hanya kalau (a) bukan akhir pekan, (b) sudah
# lewat 06:30 WIB, (c) hari ini belum pernah terkirim. Slot pertama yang
# memenuhi syarat mengirim, slot lain dilewati.
#
# Slot: 20:00, 22:00, 00:00, 02:00 UTC = 03:00, 05:00, 07:00, 09:00 WIB.
# Kalau semua slot telat 6 jam, yang lolos tetap slot 20:00 UTC (pukul 09:00).
# Kalau tidak ada delay sama sekali, yang lolos slot 00:00 UTC (pukul 07:00).
#
# Batas tetap ada: jadwal GitHub bisa otomatis dimatikan kalau repo tidak
# ada aktivitas 60 hari, dan run tetap bisa terlambat berjam-jam di hari
# yang sangat ramai. Untuk jadwal yang wajib presisi, Cloud Scheduler
# lebih akurat tapi menuntut billing Blaze.

on:
  schedule:
    - cron: '0 20 * * *' # 03:00 WIB
    - cron: '0 22 * * *' # 05:00 WIB
    - cron: '0 0 * * *'  # 07:00 WIB
    - cron: '0 2 * * *'  # 09:00 WIB
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Hanya cetak rekap, jangan kirim ke Telegram'
        type: boolean
        default: false
      force:
        description: 'Kirim sekarang, abaikan jam dan cek "sudah pernah terkirim"'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Tidak butuh npm ci: script ini hanya memakai fetch bawaan Node 22,
      # tanpa dependency dari package.json. Installasi penuh hanya menambah
      # waktu dan permukaan serangan tanpa dipakai.
      - name: Send recap
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}
          VITE_TELEGRAM_CHAT_ID: ${{ secrets.VITE_TELEGRAM_CHAT_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          missing=0
          for name in FIREBASE_TOKEN VITE_TELEGRAM_BOT_TOKEN VITE_TELEGRAM_CHAT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name kosong."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Isi ulang dengan scripts/set-github-secrets.ps1"
            exit 1
          fi

          args=""
          if [ "${DRY_RUN:-false}" = "true" ]; then
            args="--dry-run"
          fi
          if [ "${FORCE:-false}" = "true" ]; then
            args="$args --force"
          fi

          # shellcheck disable=SC2086
          node scripts/send-daily-recap.mjs $args
